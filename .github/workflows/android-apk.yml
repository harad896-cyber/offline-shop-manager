name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**', 'test/**', 'pubspec.yaml', '.github/workflows/android-apk.yml']
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
      - name: Generate Android project
        run: flutter create --platforms=android --org com.arad .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Prepare stable download filename
        run: cp build/app/outputs/flutter-apk/app-release.apk offline-shop-manager.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-shop-manager-android
          path: offline-shop-manager.apk
          retention-days: 30
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shop-v${{ github.run_number }}
          name: Offline Shop Manager ${{ github.run_number }}
          body: |
            Android release build generated by GitHub Actions.
            Download **offline-shop-manager.apk** below and install it on Android.
          files: offline-shop-manager.apk
          make_latest: true
          fail_on_unmatched_files: true
